stages:
  - move
  - build

build:
  stage: build
  script:
    - echo "Building the application on SSH server..."
    - hostname
    - pwd
    - ssh wallet  "mkdir -p  /home/ahdev/application/wallet/ && cd /home/ahdev/application/wallet/ && chmod +x ./gradlew && ./gradlew clean && ./gradlew build -x test"

    - echo "Source code built on remote server"
  only:
    - main

move:
  stage: move
  script:
    - echo "Copying  from remote server to GitLab CI/CD..."
    - hostname
    - pwd



    - scp -o StrictHostKeyChecking=no   -r ./*  wallet:/home/ahdev/application/wallet


    - echo "Artifacts uploaded to GitLab CI/CD."
  only:
    - main
