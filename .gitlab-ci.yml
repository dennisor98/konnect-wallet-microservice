stages:
  - move
  - build
  

build:
  stage: build
  script:
    - echo "Building the application on SSH server..."
    - hostname
    - pwd
    - ssh file_server  "mkdir -p  /home/ahdev/application/Minio-File-Server/build/libs2 && cd /home/ahdev/application/Minio-File-Server/build/libs2 && chmod +x ./gradlew && ./gradlew clean && ./gradlew build -x test"

    - echo "Source code built on remote server"
  only:
    - main

move:
  stage: move
  script:
    - echo "Copying  from remote server to GitLab CI/CD..."
    - hostname
    - pwd


    - ssh file_server "rm -rf /home/ahdev/application/Minio-File-Server/build/libs2/*"

    - scp -o StrictHostKeyChecking=no   -r ./*  file_server:/home/ahdev/application/Minio-File-Server/build/libs2/ 


    - echo "Artifacts uploaded to GitLab CI/CD."
  only:
    - main
